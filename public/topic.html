<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>专题合集 - 72tool</title>
  <meta name="description" content="按用途聚合的在线工具专题合集。" />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" id="canonical" href="" />
  <link rel="stylesheet" href="/common/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" id="brand" href="/">72tool</a>
      <nav class="topnav" id="topnav" aria-label="站点导航">
        <a href="/">首页</a><a href="/article">教程资讯</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深色 / 浅色模式">🌓</button>
    </div>
  </header>

  <main class="wrap" id="main">
    <section class="hero">
      <h1 id="siteTitle">专题合集</h1>
      <p id="siteDesc" class="sub">按用途整理的工具合集，帮你快速找到合适的那一款。</p>
    </section>

    <!-- 专题工具合集（按 config.topic.defs[slug] 聚合） -->
    <section id="topicContent" aria-live="polite"></section>

    <!-- 广告位（专题页也挂广告，异步加载不阻塞首屏） -->
    <div data-ad="article" aria-label="广告位"></div>

    <!-- 分销推荐位 -->
    <section id="affBox" aria-label="相关工具推荐"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap" id="footer">
      <a href="/privacy" rel="nofollow noopener">隐私政策</a>
    </div>
  </footer>

  <!-- 主题切换（轻量内联，不依赖 app.js） -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) document.documentElement.classList.add('dark');
      var btn = document.getElementById('themeToggle');
      if (btn) btn.addEventListener('click', function () {
        var now = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', now ? 'dark' : 'light');
      });
    })();
  </script>

  <script src="/common/site.js"></script>
  <script src="/common/cookie.js"></script>
  <script src="/common/affiliate.js"></script>
  <script src="/common/ads.js"></script>
  <script>
  (function () {
    'use strict';
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    var base = (window.Site && window.Site.base) || '/';
    function sitePath(sub) { return (base === '/' ? '' : base) + sub; }
    function loadJSON(u) { return fetch(u, { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
    function disclaimerHTML(gconf, cfg) {
      var dl = (gconf && gconf.compliance && gconf.compliance.disclaimer) || {};
      if (dl.enabled === false) return '';
      var lk = String((cfg && cfg.lang) || 'zh-CN').split('-')[0];
      var txt = dl.byLang && dl.byLang[lk];
      return txt ? '<span class="footer-disclaimer">' + esc(txt) + '</span>' : '';
    }
    function cardHTML(t) {
      var AFF = window.AFF || {};
      var href = (AFF.href && AFF.href(t)) || (t.url || '#');
      var rel = (AFF.rel && AFF.rel(t)) || 'nofollow noopener';
      var badge = (AFF.badge && AFF.badge(t)) || '';
      var copy = (AFF.copyHTML && AFF.copyHTML(t)) || '';
      return '<div class="aff-item">' +
        '<a class="aff-link" href="' + esc(href) + '" target="_blank" rel="' + esc(rel) + '">' +
          '<span class="aff-name">' + esc(t.name) + badge + '</span>' +
          '<span class="aff-desc">' + esc((t.desc || '').slice(0, 80)) + '</span>' +
        '</a>' + copy +
      '</div>';
    }

    Promise.all([
      (window.Site && window.Site.globalConfig ? window.Site.globalConfig() : Promise.resolve({})),
      (window.Site && window.Site.meta ? window.Site.meta() : Promise.resolve({})),
      loadJSON(sitePath('/data/list.json')),
      (window.AFF ? window.AFF.load() : Promise.resolve())
    ]).then(function (r) {
      var gconf = r[0] || {}, scfg = r[1] || {}, td = r[2] || { tools: [] };
      var tools = td.tools || [];
      var topic = (gconf.topic) || {};
      var defs = topic.defs || [];
      var slug = new URLSearchParams(location.search).get('slug') || '';
      var def = defs.filter(function (d) { return d.slug === slug; })[0];

      document.getElementById('canonical').setAttribute('href', location.origin + '/topic/' + encodeURIComponent(slug));
      if (!topic.enabled || !def) {
        document.getElementById('siteTitle').textContent = '专题合集';
        document.getElementById('topicContent').innerHTML = '<p class="empty">未找到该专题。</p>';
        document.getElementById('footer').innerHTML =
          '<a href="/privacy" rel="nofollow noopener">隐私政策</a>' + disclaimerHTML(gconf, scfg);
        return;
      }

      // 匹配工具：def.tools（名称列表）或 def.match（分类/关键词）
      var matched = tools;
      if (def.tools && def.tools.length) {
        var set = def.tools.map(function (n) { return String(n).toLowerCase(); });
        matched = tools.filter(function (t) { return set.indexOf(String(t.name).toLowerCase()) >= 0; });
      } else if (def.match) {
        var m = String(def.match).toLowerCase();
        matched = tools.filter(function (t) {
          if (t.category === def.match) return true;
          return (t.name + ' ' + (t.desc || '') + ' ' + (t.tags || []).join(' ')).toLowerCase().indexOf(m) >= 0;
        });
      }

      document.title = (def.title || def.slug) + ' - 72tool';
      document.getElementById('siteTitle').textContent = def.title || def.slug;
      document.getElementById('siteDesc').textContent = def.desc || '按用途整理的工具合集。';

      var box = document.getElementById('topicContent');
      box.innerHTML = matched.length
        ? '<section class="aff-box"><div class="aff-list">' + matched.map(cardHTML).join('') + '</div></section>'
        : '<p class="empty">暂无匹配工具。</p>';

      document.getElementById('footer').innerHTML =
        '<a href="/privacy" rel="nofollow noopener">隐私政策</a>' + disclaimerHTML(gconf, scfg);

      // 分销推荐位（资讯页同款 boxHTML）
      var affBox = document.getElementById('affBox');
      if (affBox && window.AFF && matched.length) {
        var abox = (scfg.affiliate && scfg.affiliate.articleBox) || {};
        affBox.innerHTML = window.AFF.boxHTML(matched, { title: '相关工具推荐', count: abox.count || 2 });
      }

      // 广告挂载（含 §4.3 骨架屏 / §4.5 关闭 / §1.3 防屏蔽降级，依赖 window.initAds）
      if (window.initAds) window.initAds(scfg, { tools: tools.length, articles: 1 }, matched);
    }).catch(function (e) {
      console.warn('[topic] 渲染失败:', e);
    });
  })();
  </script>
</body>
</html>
